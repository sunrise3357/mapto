<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>네이버지도 길찾기</title>
  <script>
    // 1. 목적지별 좌표 목록 (자주 가는 곳을 자유롭게 추가하세요)
    const PLACES = {
      "미사역파라곤": { lat: "37.5651612", lng: "127.1942672" },
      "미사역":       { lat: "37.5627",    lng: "127.1932" },
      "명동역":       { lat: "37.560989",  lng: "126.986325" },
      "강남역":       { lat: "37.497952",  lng: "127.027619" },
      "잠실역":       { lat: "37.513261",  lng: "127.100133" },
      "서울역":       { lat: "37.554648",  lng: "126.972559" }
    };

    // 2. URL 뒤의 목적지 추출 (?명동역, ?미사역파라곤 등)
    const query = decodeURIComponent(location.search.replace(/^\?/, "")).trim();
    const dest = query || "미사역파라곤";
    const target = PLACES[dest] || PLACES["미사역파라곤"];

    // 3. 처음 주신 원래 파일 방식 그대로 즉시 실행
    const U = "nmap://route/public?dlat=" + target.lat + "&dlng=" + target.lng + "&dname=" + encodeURIComponent(dest) + "&appname=misa-paragon-route";
    location.replace(U);
  </script>
</head>
<body style="font-family:sans-serif; text-align:center; padding-top:25vh">
  <h2 id="title">네이버지도 실행 중</h2>
  <p>대중교통 길찾기를 실행합니다.</p>
  <button style="padding:18px 30px; background:#03c75a; color:white; border:0; border-radius:12px; font-size:18px" onclick="location.href=U">
    네이버지도 다시 실행
  </button>
  <script>
    document.getElementById("title").innerText = dest + " 가는 길";
  </script>
</body>
</html>
